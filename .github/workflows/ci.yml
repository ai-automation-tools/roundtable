name: CI

# Cheap smoke gate on every push / PR: install pinned deps, confirm the
# modules import + compile, validate the tracked configs, and run the test
# suites. Runs on Windows because requirements.txt pins pywin32 (the project
# is Windows-first; the Linux Fly image strips pywin32 separately in its
# Dockerfile, so a Linux CI runner can't `pip install -r requirements.txt`).

# homepage/ is the static Pages site (homepage.yml); a change there alone
# touches no Python, so it doesn't spend a Windows runner.
on:
  push:
    paths-ignore:
      - 'homepage/**'
      - '.github/workflows/homepage.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'homepage/**'
      - '.github/workflows/homepage.yml'
  # dependabot-pydantic-core.yml re-runs CI this way after fixing a pin.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never on main: a newer push there would cancel a deploy half way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # CI-only: tests/test_orchestrate_browser.py drives /orchestrate's JS in a
      # real Chromium. Locally it skips unless you install these yourself.
      - name: Install browser-test dependencies
        run: python -m pip install -r requirements-dev.txt && python -m playwright install chromium

      - name: Import smoke test
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import agent_chat_mcp, web_ui, inspect_conversations, start_conversation; from orchestrator import seeding, preflight, personas; print('imports OK')"

      - name: Compile all sources
        run: python -m compileall -q src scripts tests

      - name: Validate tracked JSON configs
        run: |
          $configs = @(
            'agents/CLIs/antigravity_agent1/.agents/mcp_config.json',
            'agents/CLIs/opencode_agent1/opencode.json'
          )
          foreach ($c in $configs) {
            python -m json.tool $c > $null
            if ($LASTEXITCODE -ne 0) { Write-Error "Invalid JSON: $c"; exit 1 }
            Write-Host "OK   $c"
          }

      - name: Validate fly.toml
        run: python -c "import tomllib; tomllib.load(open('fly.toml','rb')); print('OK   fly.toml')"

      - name: Diagram drift
        # Warns, never fails: rebuilding needs Node + Chrome + Archify, which CI doesn't
        # have. A warning means code cited by docs/diagrams/process-flow.json changed since
        # its pinned commit; docs/diagrams/README.md says how to update it.
        run: |
          python scripts/build_diagram.py --hook | ForEach-Object {
            if ($_ -like 'ISSUE:*') { "::warning title=Diagram drift::$_" } else { $_ }
          }

      - name: Run test suites
        # Globbed, not listed: every file in tests/ is standalone-runnable by
        # convention, and an explicit list silently drops new suites (it was
        # still naming two of six when test_persona_avatars.py landed).
        run: |
          $failed = @()
          Get-ChildItem tests/test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failing suites: $($failed -join ', ')"
            exit 1
          }

  # Which paths changed — decides whether the mirror's image needs building
  # (PRs) or deploying (main). Kept in step with AGENTS.md › Deploying to Fly.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          WEB='^(src/web_ui\.py|src/web/|requirements\.txt|fly\.toml|Dockerfile|images/AgentChat-Avatars/)'
          # An unknown base (first push, force-push, dispatch) counts as a web change.
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) && ! grep -Eq "$WEB" <<<"$files"; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

  # The Fly image, built and booted the way fly.toml runs it, before a PR that
  # changes it can merge. Fly builds remotely at deploy time, so without this a
  # broken Dockerfile or Linux-only pin failure first shows up in production.
  image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t roundtable-mirror .
      - name: Boot and answer health
        run: |
          docker run -d --name mirror -p 8080:8080 -e AGENT_CHAT_DB=/tmp/chat.db -e AGENT_CHAT_PUBLIC_READONLY=1 roundtable-mirror
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/battleground/healthz | grep -Eq '"ok": ?true'; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "image healthy" && exit 0
            fi
            sleep 2
          done
          docker logs mirror; exit 1

  # Deploy only after the tests pass, and only when the push touched the mirror.
  deploy:
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/deploy-fly.yml
    secrets: inherit
