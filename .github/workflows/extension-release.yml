name: Extension release

# Publishes a GitHub release, extension-v<version>, with the Chrome and Firefox zips
# whenever the extension's version changes on main (audit RT-32). A version that is
# already released is skipped, so re-running is harmless. Bump both manifests together.
# Windows runner: build-extension.ps1 uses Windows path separators.
on:
  push:
    branches: [main]
    paths:
      - 'extension/manifest.json'
      - 'extension/manifest.firefox.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both zips and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v  = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $fv = (Get-Content extension/manifest.firefox.json -Raw | ConvertFrom-Json).version
          if ($v -ne $fv) { throw "manifest versions differ: chrome $v, firefox $fv" }
          $tag = "extension-v$v"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "$tag is already released"; exit 0 }
          ./scripts/build-extension.ps1 -Browser chrome -Zip
          ./scripts/build-extension.ps1 -Browser firefox -Zip
          $notes = "AgentBattleground browser extension $v. Chrome: unzip and *Load unpacked*. Firefox: *about:debugging* -> *Load Temporary Add-on* -> the unzipped manifest.json. Setup: extension/README.md."
          gh release create $tag (Get-ChildItem extension/dist/*.zip).FullName --target $env:GITHUB_SHA --title "AgentBattleground $v" --notes $notes
